apiVersion: apps/v1
kind: Deployment
metadata:
  name: biometric-scout-image
  labels:
    app: biometric-scout-image
spec:
  replicas: 2
  selector:
    matchLabels:
      app: biometric-scout-image
  template:
    metadata:
      labels:
        app: biometric-scout-image
    spec:
      containers:
      - name: biometric-scout-image
        image: 106059658660.dkr.ecr.us-east-1.amazonaws.com/biometric-scout-repo:latest
        ports:
        - containerPort: 8080
        resources:
          limits:
            cpu: "1000m"
            memory: "1024Mi"
          requests:
            cpu: "500m"
            memory: "512Mi"
        env:
        - name: PORT
          value: "8080"
        - name: GOOGLE_CLOUD_PROJECT
          value: "comglitn"
        - name: GOOGLE_CLOUD_LOCATION
          value: "us-central1"
        - name: GOOGLE_GENAI_USE_VERTEXAI
          value: "false"
        - name: GOOGLE_API_KEY
          value: "AIzaSyCN6eqI2BrU5Wt6j5rrkUgDIp7jboS_fpI"
        - name: MODEL_ID
          value: "gemini-2.5-flash-native-audio-preview-12-2025"
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: biometric-scout-image-service
spec:
  selector:
    app: biometric-scout-image
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080
  type: LoadBalancer
