apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig

metadata:
  name: biometric-scout-cluster
  region: us-east-1
  version: "1.31"

managedNodeGroups:
  - name: standard-nodes
    instanceType: t3.medium
    minSize: 2
    maxSize: 4
    desiredCapacity: 2
    volumeSize: 20
    ssh:
      allow: true
    labels:
      role: worker
    iam:
      withAddonPolicies:
        imageBuilder: true
        autoScaler: true
        cloudWatch: true

iam:
  withOIDC: true
