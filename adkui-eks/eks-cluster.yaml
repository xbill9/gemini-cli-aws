apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig

metadata:
  name: adkui-eks-cluster
  region: us-east-1
  version: "1.31"

managedNodeGroups:
  - name: standard-nodes
    instanceType: t3.medium
    minSize: 2
    maxSize: 4
    desiredCapacity: 2
    volumeSize: 20
    ssh:
      allow: true # Optional: allows SSH access to nodes
    labels:
      role: worker
    iam:
      withAddonPolicies:
        imageBuilder: true
        autoScaler: true
        cloudWatch: true

# Optional: Add OIDC provider for IRSA (IAM Roles for Service Accounts)
iam:
  withOIDC: true
